<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar frase</title>
    <link href="/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Karla:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
</head>
<body data-page="edit">
    <nav class="navbar" aria-label="Navegação principal">
        <a href="/index.html">Hoje</a>
        <a href="/historico.html">Histórico</a>
    </nav>

    <main class="container">
        <section class="frases form-card">
            <h1 class="page-title">Alterar a frase do dia</h1>
            <p id="current-phrase" class="current-phrase">Carregando a frase atual...</p>
            <form id="phrase-form">
                <label for="new-phrase">Nova frase</label>
                <textarea id="new-phrase" name="phrase" rows="4" maxlength="500" required></textarea>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                <button type="submit">Salvar frase</button>
            </form>
            <button id="logout-button" class="secondary-button" type="button">Sair</button>
        </section>
        <footer class="footer">
            <a href="/index.html">Ver frase do dia</a>
        </footer>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
